<!-- Maskable icon: full bleed background, content within 80% safe zone circle (r=205) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#020617"/>
  <g stroke="#10b981" stroke-linecap="round" stroke-width="18">
    <!-- Main axes (arms 150px from center) -->
    <line x1="256" y1="106" x2="256" y2="406"/>
    <line x1="106" y1="256" x2="406" y2="256"/>
    <!-- Diagonals (offset 106px ≈ 150/√2) -->
    <line x1="150" y1="150" x2="362" y2="362"/>
    <line x1="362" y1="150" x2="150" y2="362"/>
    <!-- Branches on top -->
    <line x1="256" y1="146" x2="226" y2="176"/>
    <line x1="256" y1="146" x2="286" y2="176"/>
    <!-- Branches on bottom -->
    <line x1="256" y1="366" x2="226" y2="336"/>
    <line x1="256" y1="366" x2="286" y2="336"/>
    <!-- Branches on left -->
    <line x1="146" y1="256" x2="176" y2="226"/>
    <line x1="146" y1="256" x2="176" y2="286"/>
    <!-- Branches on right -->
    <line x1="366" y1="256" x2="336" y2="226"/>
    <line x1="366" y1="256" x2="336" y2="286"/>
  </g>
  <circle cx="256" cy="256" r="18" fill="#10b981"/>
</svg>
